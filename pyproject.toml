[project]
name = "chat2api-tui"
dynamic = ["version"]
description = "基于 Chat2API 的终端用户界面，支持智能体循环、工具调用和多轮对话"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PL", "RUF", "S"]
ignore = [
    "S101",     # assert in tests
    "S603",     # subprocess intentional (exec_cmd tool)
    "S607",     # partial paths
    "PLR0913",  # UI components may have many params
    "PLR2004",  # UI constants as magic values
]

[tool.ruff.lint.isort]
known-first-party = ["core", "tools", "widgets"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
